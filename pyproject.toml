[project]
name = "kira"
version = "0.1.0"
description = "Local voice AI assistant — Hey Kira"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "keyboard>=0.13.5",
    "httpx>=0.27.0",
    "ollama>=0.4.0",
    "openwakeword>=0.6.0",
]

[project.scripts]
kira = "kira.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
